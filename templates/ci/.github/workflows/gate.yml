name: {% if options["skill_lang"] | default("zh") == "en" %}gate{% else %}提交门禁{% endif %}

on:
  pull_request:
  merge_group:
  push:
    branches: [main, master]
  workflow_dispatch:

# {% if options["skill_lang"] | default("zh") == "en" %}Only the newest run per branch matters: an outdated run reports on a range that no longer exists.{% else %}同一个分支只保留最新一次运行：过期的运行报告的提交范围早已不存在。{% endif %}
concurrency:
  group: {% raw %}${{ github.workflow }}-${{ github.ref }}{% endraw %}
  cancel-in-progress: true

# {% if options["skill_lang"] | default("zh") == "en" %}The server-side counterpart of the local commit hooks. It needs nothing from the contributor's machine, so a pull request is checked even when the author never installed the CLI.{% else %}本地提交钩子的服务端对应物。它不需要贡献者机器上的任何配置，所以即使作者从未安装 CLI，PR 一样会被校验。{% endif %}
permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    # {% if options["skill_lang"] | default("zh") == "en" %}The name is a stable identifier on purpose: a required status check refers to it, and that reference must not break when the documentation language changes.{% else %}这里的名字是刻意保持稳定的标识：必需状态检查引用的就是它，而这份引用不能因为文档语言切换就失效。{% endif %}
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # {% if options["skill_lang"] | default("zh") == "en" %}Pin latest major Action versions (Node 24 runtime, no Node 20 deprecation warnings); when adding project CI workflows, prefer `actions/checkout@v7`, `actions/cache@v6`, `Swatinem/rust-cache@v2` and `taiki-e/install-action@v2` with `concurrency` enabled.{% else %}使用最新主版本 Action（Node 24 运行时，无 Node 20 弃用警告）；项目扩展自有 CI 工作流时，建议统一采用 `actions/checkout@v7`、`actions/cache@v6`、`Swatinem/rust-cache@v2`、`taiki-e/install-action@v2` 并开启 `concurrency`。{% endif %}
      - uses: actions/checkout@v7
        with:
          # {% if options["skill_lang"] | default("zh") == "en" %}The full history is needed to walk the commit range, and the head ref keeps GitHub's auto-generated merge commit out of the range.{% else %}校验提交范围需要完整历史；检出 head ref 可避免把 GitHub 自动生成的合并提交算进来。{% endif %}
          fetch-depth: 0
          ref: {% raw %}${{ github.event.pull_request.head.sha || github.sha }}{% endraw %}
          # {% if options["skill_lang"] | default("zh") == "en" %}Checkout leaves submodules empty, so a project whose path dependencies live in a submodule cannot even load its workspace — and the failure surfaces as a missing dependency rather than a missing submodule. Harmless for projects without submodules.{% else %}checkout 默认不检出子模块，路径依赖放在子模块里的项目连 workspace 都加载不了，而报错表现为「找不到依赖」而不是缺子模块。没有子模块的项目不受影响。{% endif %}
          submodules: true

      # {% if options["skill_lang"] | default("zh") == "en" %}Keep `gate` running on every push/PR so the required status check never stalls, but skip Rust/code checks when the diff only touches docs.{% else %}保持 `gate` 在每次推送与 PR 上运行以确保必需状态检查永不挂起，但若本次改动仅涉及文档，则跳过 Rust 与代码检查步骤。{% endif %}
      - name: {% if options["skill_lang"] | default("zh") == "en" %}Detect code changes{% else %}探测代码变更{% endif %}
        id: changes
        env:
          GATE_BASE: {% raw %}${{ github.event.pull_request.base.sha || github.event.before }}{% endraw %}
        run: |
          base="${GATE_BASE:-}"
          if printf '%s' "$base" | grep -qE '^0+$' || [ -z "$base" ] || ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null 2>&1; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base"..HEAD 2>/dev/null || true)
          if [ -z "$changed" ]; then
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code_changed=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              docs/*|.agents/*|.github/pull_request_template.md|LICENSE*)
                ;;
              */*)
                code_changed=true
                break
                ;;
              *.md)
                ;;
              *)
                code_changed=true
                break
                ;;
            esac
          done <<EOF
          $changed
          EOF
          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"

      - name: {% if options["skill_lang"] | default("zh") == "en" %}Install pengj-templates-cli{% else %}安装 pengj-templates-cli{% endif %}
        run: |
          curl -fsSL https://github.com/pengjiaxusz/pengj-templates/releases/latest/download/install.sh | sh
          echo "${XDG_DATA_HOME:-$HOME/.local/share}/pengj-templates/bin" >> "$GITHUB_PATH"

      - name: {% if options["skill_lang"] | default("zh") == "en" %}Check the commit messages{% else %}校验提交标题{% endif %}
        env:
          # {% if options["skill_lang"] | default("zh") == "en" %}The base of the range: the target branch for a pull request, the previous commit for a push.{% else %}范围的基准：PR 用目标分支，推送用上一个提交。{% endif %}
          GATE_BASE: {% raw %}${{ github.event.pull_request.base.sha || github.event.before }}{% endraw %}
        run: |
          base="${GATE_BASE:-}"
          # {% if options["skill_lang"] | default("zh") == "en" %}An all-zero base is a branch deletion, and after a force-push the base can point at a commit that no longer exists; both fall back to running without a base, otherwise `git log` errors out and the gate fails for a reason unrelated to the commits.{% else %}全零 base 代表分支删除，而 force-push 之后 base 也可能指向一个已不存在的提交；两种情况都退回不带 base 的检查，否则 git log 会直接报错，门禁因无关原因失败。{% endif %}
          if printf '%s' "$base" | grep -qE '^0+$' || { [ -n "$base" ] && ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null 2>&1; }; then
            base=""
          fi
          set +e
          if [ -n "$base" ]; then
            output=$(pengj-templates-cli gate check-commits --base "$base" 2>&1)
          else
            output=$(pengj-templates-cli gate check-commits 2>&1)
          fi
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            {
              echo "## {% if options["skill_lang"] | default("zh") == "en" %}The commit gate rejected this range{% else %}提交门禁拦下了这段提交{% endif %}"
              echo ""
              echo '```'
              printf '%s\n' "$output"
              echo '```'
              echo ""
              echo '{% if options["skill_lang"] | default("zh") == "en" %}Every commit needs a subject of the form `type(scope): subject`. The rule set lives in `.pengj-templates/gate.toml`.{% else %}范围内每个提交的标题都要写成 `type(scope): 摘要`。规则集在 `.pengj-templates/gate.toml` 里。{% endif %}'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: {% if options["skill_lang"] | default("zh") == "en" %}Run the code language guard{% else %}运行代码语言守卫{% endif %}
        if: {% raw %}steps.changes.outputs.code_changed == 'true'{% endraw %}
        run: |
          set +e
          output=$(pengj-templates-cli gate check 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            {
              echo "## {% if options["skill_lang"] | default("zh") == "en" %}The code language guard reported violations{% else %}代码语言守卫报了违规{% endif %}"
              echo ""
              echo '```'
              printf '%s\n' "$output"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: {% if options["skill_lang"] | default("zh") == "en" %}Check the documentation language{% else %}校验文案语言{% endif %}
        run: |
          set +e
          output=$(pengj-templates-cli check-lang --dir . 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            {
              echo "## {% if options["skill_lang"] | default("zh") == "en" %}The documentation language gate reported violations{% else %}文案语言门禁报了违规{% endif %}"
              echo ""
              echo '```'
              printf '%s\n' "$output"
              echo '```'
              echo ""
              echo '{% if options["skill_lang"] | default("zh") == "en" %}English projects must have no Han characters; Chinese projects must have Chinese in human-facing copy. Fix the template and run `update`.{% else %}英文项目不得出现汉字，中文项目面向人的文案必须含中文。请到模板源修复后对项目执行 `update`。{% endif %}'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      {%- if "rust" in layers or "rust-workspace" in layers %}

      # {% if options["skill_lang"] | default("zh") == "en" %}The local pre-commit hook formats the staged Rust files; without the CLI that never happens, so the server checks it.{% else %}本地 pre-commit 钩子会格式化暂存的 Rust 文件；没装 CLI 时这一步不会发生，所以由服务端补上。{% endif %}
      - name: {% if options["skill_lang"] | default("zh") == "en" %}Check the formatting{% else %}检查代码格式{% endif %}
        if: {% raw %}steps.changes.outputs.code_changed == 'true'{% endraw %}
        run: cargo fmt --check
      {%- endif %}
