name = "Gate"
description = "提交门禁：约定式提交校验、代码语言守卫与 rustfmt 暂存格式化，纯 Rust 实现无第三方依赖，产出 .gate.toml 与 .githooks 钩子；自动带上 ci 层在服务端执行同一套规则"
depends = ["common"]

# 更新黑名单：`.gate.toml` 的配置值归项目所有，模板不覆盖。
# 但文件头部的受管说明块（PENGJ_TEMPLATE_START/END）仍随模板刷新——说明不是用户资产，
# 冻结它只会让语义一旦反转，注释继续按旧说法骗人。
update_ignore = [".gate.toml"]
