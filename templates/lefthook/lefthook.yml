# {% if options["skill_lang"] == "en" %}lefthook.yml — git hook configuration (lefthook layer){% else %}lefthook.yml — git hooks 配置（lefthook 层）{% endif %}
{% if 'rust' in layers or 'rust-workspace' in layers %}
pre-commit:
  commands:
    rustfmt:
      glob: "*.rs"
      run: rustfmt {staged_files}
      stage_fixed: true
{% endif %}
commit-msg:
  commands:
    commitlint:
      # {% if options["skill_lang"] == "en" %}Use pnpm exec (commitlint is installed locally) instead of npx; "{1}" is a lefthook placeholder (cross-platform, do not use $1){% else %}用 pnpm exec（本地已装 commitlint）而非 npx；"{1}" 是 lefthook 占位符（跨平台，勿用 $1）{% endif %}
      run: pnpm exec commitlint --edit "{1}"
