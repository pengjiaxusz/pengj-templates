[workspace]
resolver = "3"
members = [
    # 在此处添加工作区成员 crate，例如 "crates/*" 或具体子目录
]

[workspace.package]
version = "0.1.0"
edition = "{{ options["edition"] or "2024" }}"

{% if options["chinese_programming"] %}
# 中文编程：允许中文标识符与字符串字面量，关闭相关命名 lint
[workspace.lints.rust]
non_ascii_idents = "allow"

[workspace.lints.clippy]
non_ascii_literal = "allow"
{% endif %}

[workspace.dependencies]
