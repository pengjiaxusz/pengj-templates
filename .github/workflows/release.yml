name: release-please
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # 自动版本号 + 生成 release PR / 合并后打 tag 建 release
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}
    steps:
      - id: release
        # 使用 googleapis 官方 action（不再弃用）。token 优先用 PAT，缺省回落 GITHUB_TOKEN。
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  # CLI 便携版压缩包（Linux / macOS；Windows 并入 GUI 便携包，见 build-gui-windows）
  build-cli:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            short: linux
          - os: macos-latest
            short: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 构建 CLI
        run: cargo build --release -p pengj-cli
      - name: 打包便携版压缩包（zip，CLI 命名 pengj-templates-cli）
        shell: bash
        run: |
          VER=$(echo "${{ needs.release-please.outputs.tag_name }}" | sed 's/^v//')
          cd "$GITHUB_WORKSPACE"
          mv "target/release/pengj" "target/release/pengj-templates-cli"
          cd target/release
          PKG="pengj-templates_${VER}_${{ matrix.short }}-x64_portable.zip"
          zip "../../$PKG" "pengj-templates-cli"
          echo "PKG=$PKG" >> "$GITHUB_ENV"
      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PKG }}
          tag_name: ${{ needs.release-please.outputs.tag_name }}

  # Tauri GUI（Windows）：安装包 msi/exe + 便携版（GUI + CLI）
  build-gui-windows:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 不指定 version，让 pnpm read packageManager（package.json: pnpm@11.6.0）
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # pnpm 11 需 Node >= 22.13
          node-version: 24
          cache: pnpm
      - name: 安装依赖
        run: pnpm install
      - name: 构建 Tauri GUI（安装包）并附加到 Release
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: ${{ needs.release-please.outputs.tag_name }}
          releaseName: ${{ needs.release-please.outputs.tag_name }}
          releaseDraft: false
          prerelease: false
      - name: 构建 CLI（供便携版）
        run: cargo build --release -p pengj-cli
      - name: 打包 Windows 便携版（GUI + CLI）
        run: |
          VER = ("${{ needs.release-please.outputs.tag_name }}" -replace '^v','')
          Set-Location "$env:GITHUB_WORKSPACE\target\release"
          Move-Item -Force pengj.exe pengj-templates-cli.exe
          $PKG = "pengj-templates_${VER}_windows-x64_portable.zip"
          Compress-Archive -Path pengj-templates.exe,pengj-templates-cli.exe -DestinationPath "$env:GITHUB_WORKSPACE\$PKG"
          "PKG=$PKG" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: 上传 Windows 便携版
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PKG }}
          tag_name: ${{ needs.release-please.outputs.tag_name }}