name: release-please
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # 自动版本号 + 生成 release PR / 合并后打 tag 建 release
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}
    steps:
      - id: release
        # 使用 googleapis 官方 action（不再弃用）。token 优先用 PAT，缺省回落 GITHUB_TOKEN。
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  # Tauri GUI（Linux）：deb 安装包 + 便携版（GUI + CLI）
  build-gui-linux:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 安装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # pnpm 11 需 Node >= 22.13
          node-version: 24
          cache: pnpm
      - name: 安装依赖
        run: pnpm install
      - name: 构建 Tauri GUI（deb 安装包）并附加到 Release
        uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles deb
          tagName: ${{ needs.release-please.outputs.tag_name }}
          releaseName: ${{ needs.release-please.outputs.tag_name }}
          releaseDraft: false
          prerelease: false
      - name: 构建 CLI（供便携版）
        run: cargo build --release -p pengj-cli
      - name: 打包 Linux 便携版（GUI + CLI）
        shell: bash
        run: |
          VER=$(echo "${{ needs.release-please.outputs.tag_name }}" | sed 's/^v//')
          cd "$GITHUB_WORKSPACE/target/release"
          mv pengj pengj-templates-cli
          PKG="pengj-templates_${VER}_linux-x64_portable.zip"
          zip "../../$PKG" pengj-templates pengj-templates-cli
          echo "PKG=$PKG" >> "$GITHUB_ENV"
      - name: 上传 Linux 便携版
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PKG }}
          tag_name: ${{ needs.release-please.outputs.tag_name }}

  # Tauri GUI（macOS）：dmg 安装包 + 便携版（GUI.app + CLI）
  build-gui-macos:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # pnpm 11 需 Node >= 22.13
          node-version: 24
          cache: pnpm
      - name: 安装依赖
        run: pnpm install
      - name: 构建 Tauri GUI（dmg）并附加到 Release
        uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles dmg
          tagName: ${{ needs.release-please.outputs.tag_name }}
          releaseName: ${{ needs.release-please.outputs.tag_name }}
          releaseDraft: false
          prerelease: false
      - name: 构建 CLI（供便携版）
        run: cargo build --release -p pengj-cli
      - name: 打包 macOS 便携版（GUI.app + CLI）
        shell: bash
        run: |
          VER=$(echo "${{ needs.release-please.outputs.tag_name }}" | sed 's/^v//')
          cd "$GITHUB_WORKSPACE/target/release"
          mv pengj pengj-templates-cli
          PKG="pengj-templates_${VER}_macos-aarch64_portable.zip"
          # 动态定位 .app（tauri 的 bundle 目录随 bundle 类型/架构变化）
          APP=$(find bundle -type d -name "*.app" 2>/dev/null | head -n1)
          if [ -n "$APP" ]; then
            zip -r "../../$PKG" "$APP" pengj-templates-cli
          else
            echo "::warning::未找到 macOS .app，便携包仅含 CLI"
            zip "../../$PKG" pengj-templates-cli
          fi
          echo "PKG=$PKG" >> "$GITHUB_ENV"
      - name: 上传 macOS 便携版
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PKG }}
          tag_name: ${{ needs.release-please.outputs.tag_name }}

  # Tauri GUI（Windows）：安装包 msi/exe + 便携版（GUI + CLI）
  build-gui-windows:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 不指定 version，让 pnpm read packageManager（package.json: pnpm@11.6.0）
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # pnpm 11 需 Node >= 22.13
          node-version: 24
          cache: pnpm
      - name: 安装依赖
        run: pnpm install
      - name: 构建 Tauri GUI（安装包）并附加到 Release
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: ${{ needs.release-please.outputs.tag_name }}
          releaseName: ${{ needs.release-please.outputs.tag_name }}
          releaseDraft: false
          prerelease: false
      - name: 构建 CLI（供便携版）
        run: cargo build --release -p pengj-cli
      - name: 打包 Windows 便携版（GUI + CLI）
        run: |
          $VER = ("${{ needs.release-please.outputs.tag_name }}" -replace '^v','')
          Set-Location "$env:GITHUB_WORKSPACE\target\release"
          Move-Item -Force pengj.exe pengj-templates-cli.exe
          # GUI 可执行文件按 Cargo 包名生成（非 productName），动态查找
          $gui = (Get-ChildItem -Filter '*.exe' | Where-Object { $_.Name -ne 'pengj-templates-cli.exe' } | Select-Object -First 1)
          if (-not $gui) { throw '未找到 GUI 可执行文件' }
          $PKG = "pengj-templates_${VER}_windows-x64_portable.zip"
          Compress-Archive -Path $gui.Name,'pengj-templates-cli.exe' -DestinationPath "$env:GITHUB_WORKSPACE\$PKG"
          "PKG=$PKG" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: 上传 Windows 便携版
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PKG }}
          tag_name: ${{ needs.release-please.outputs.tag_name }}