name: release-please
on:
  push:
    branches: [main]
    # 纯文档 / 非构建相关改动不触发发布流程（与 ci.yml 的忽略列表保持一致）。
    # release-please 只响应 feat/fix/BREAKING 等提交；若要用 Release-As 强制发版，
    # 请把它写在改动代码/模板/配置的提交里（纯文档提交不会触发本 workflow）。
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.agents/**'

permissions:
  contents: write
  pull-requests: write

# 发布流程按分支串行排队，不取消进行中的发布以免半途中断产物上传
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 自动版本号 + 生成 release PR / 合并后打 tag 建 release
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}
    steps:
      - id: release
        # 使用 googleapis 官方 action（不再弃用）。token 优先用 PAT，缺省回落 GITHUB_TOKEN。
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  # CLI 全平台矩阵构建：Windows/Linux/macOS × x64/arm64
  # 产物统一命名为「系统-架构」，Release 页一眼可辨；便携版只含 CLI。
  build-cli:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            runner: windows-latest
            os: windows
            arch: x86_64
            rust_target: x86_64-pc-windows-msvc
          - id: windows-arm64
            runner: windows-11-arm
            os: windows
            arch: arm64
            rust_target: aarch64-pc-windows-msvc
          # Linux 产物统一走 musl 静态链接，消除宿主机 glibc 版本绑定（如 ubuntu-24.04
          # 产出的 GLIBC_2.39 在 Debian 12 等较低 glibc 发行版上无法运行的问题）；
          # 归档名仍保持 `linux-x86_64` / `linux-arm64`，不破坏 install.sh 与 self update。
          - id: linux-x64
            runner: ubuntu-latest
            os: linux
            arch: x86_64
            rust_target: x86_64-unknown-linux-musl
          - id: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            rust_target: aarch64-unknown-linux-musl
          - id: macos-arm64
            runner: macos-latest
            os: macos
            arch: arm64
            rust_target: aarch64-apple-darwin
          - id: macos-x64
            runner: macos-latest
            os: macos
            arch: x86_64
            rust_target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUST_TARGET: ${{ matrix.rust_target }}
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: 添加 Rust 目标
        run: rustup target add ${{ matrix.rust_target }}
      # 仓库根的 .cargo/config.toml 把宿主机 linux-gnu 目标的链接器写死为 lld
      # （build script / proc-macro 仍以宿主机目标编译），而 musl 目标的 ring 需要 musl-gcc。
      - name: 安装 Linux 构建工具（lld 与 musl-tools）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y lld musl-tools
      # Rust 编译缓存（含失败缓存：打包中途失败时，修复后的重跑也能吃到缓存）
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: 构建 CLI
        run: cargo build --release -p pengj-templates-cli --target ${{ matrix.rust_target }}
      # ===== 重命名产物为「系统-架构」显式命名 =====
      - name: 重命名 CLI 产物
        shell: bash
        run: |
          set -e
          VER=$(echo "${{ needs.release-please.outputs.tag_name }}" | sed 's/^v//')
          R="$GITHUB_WORKSPACE/target/${{ matrix.rust_target }}/release"
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "REL_DIR=$R" >> "$GITHUB_ENV"
          # 可执行文件扩展名（Windows 带 .exe）
          EXT=""
          if [ "${{ matrix.os }}" = "windows" ]; then EXT=".exe"; fi
          # CLI 统一命名 pengj-templates-cli
          if [ -f "$R/pengj${EXT}" ]; then
            mv -f "$R/pengj${EXT}" "$R/pengj-templates-cli${EXT}"
          fi
      # ===== 便携版 bundle：CLI + templates =====
      # 模板目录是运行时读取的（改模板无需重编译），所以便携包必须连 templates 一起带走；
      # 少了 templates，CLI 就只剩一个空壳。
      # 产出两份：带版本号的给人看（Release 页面），稳定命名的给安装脚本用
      # （`releases/latest/download/<稳定名>` 才能跨版本命中）。
      - name: 打包便携版（Windows）
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $VER = "$env:VER".Trim()
          # bash 与 pwsh 的 GITHUB_WORKSPACE 路径风格不同，必须用 WS 自行拼接
          $R = "$env:GITHUB_WORKSPACE\target\${{ matrix.rust_target }}\release"
          $STAGE = "$env:GITHUB_WORKSPACE\stage-${{ matrix.id }}"
          Remove-Item $STAGE -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$STAGE\pengj-templates" | Out-Null
          Copy-Item "$R\pengj-templates-cli.exe" "$STAGE\pengj-templates\pengj-templates-cli.exe"
          Copy-Item "$env:GITHUB_WORKSPACE\templates" "$STAGE\pengj-templates\templates" -Recurse
          Compress-Archive -Path "$STAGE\pengj-templates" -DestinationPath "$env:GITHUB_WORKSPACE\pengj-templates-cli-${{ matrix.os }}-${{ matrix.arch }}.zip" -Force
          Compress-Archive -Path "$STAGE\pengj-templates" -DestinationPath "$env:GITHUB_WORKSPACE\pengj-templates_${VER}_${{ matrix.os }}-${{ matrix.arch }}_portable.zip" -Force
          Remove-Item $STAGE -Recurse -Force -ErrorAction SilentlyContinue
      - name: 打包便携版（Unix）
        if: matrix.os != 'windows'
        shell: bash
        run: |
          set -e
          R="$REL_DIR"
          STAGE="$GITHUB_WORKSPACE/stage-${{ matrix.id }}"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/pengj-templates"
          cp "$R/pengj-templates-cli" "$STAGE/pengj-templates/pengj-templates-cli"
          cp -R "$GITHUB_WORKSPACE/templates" "$STAGE/pengj-templates/templates"
          tar -czf "$GITHUB_WORKSPACE/pengj-templates-cli-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" -C "$STAGE" pengj-templates
          tar -czf "$GITHUB_WORKSPACE/pengj-templates_${VER}_${{ matrix.os }}-${{ matrix.arch }}_portable.tar.gz" -C "$STAGE" pengj-templates
          rm -rf "$STAGE"
      # ===== 上传便携版到 Release =====
      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pengj-templates_${{ env.VER }}_${{ matrix.os }}-${{ matrix.arch }}*
            pengj-templates-cli-${{ matrix.os }}-${{ matrix.arch }}.*
          tag_name: ${{ needs.release-please.outputs.tag_name }}
      # pre-release（版本带 - 后缀，如 beta/rc）时把 release 标为 GitHub Prerelease，
      # 让 Release 页显示橙色 PRE-RELEASE 徽章。幂等，矩阵各组合重复执行无害。
      - name: 标记 pre-release 徽章
        shell: bash
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          if echo "$TAG" | grep -q '-'; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease || echo "::warning::标记 prerelease 失败（可能发布并发问题，可稍后手动）"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===== 一键安装脚本 =====
  # 单独一个 job 上传：`releases/latest/download/install.ps1` 这种固定名才能跨版本命中，
  # 而矩阵并行上传同名资产会互相冲突。
  publish-installers:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: 上传安装脚本到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tools/install.ps1
            tools/install.sh
          tag_name: ${{ needs.release-please.outputs.tag_name }}

  # Release 合并后，把工作区新版本号自动写回 Cargo.lock 并提交
  # （release-please 只会 bump Cargo.toml / package.json，Cargo.lock 需要 cargo 同步）
  sync-lockfile:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: 生成工作区 resolve 并同步自版本号到 Cargo.lock
        run: |
          cargo update --workspace
          git status --porcelain
      - name: 提交并推送 Cargo.lock 同步
        run: |
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock 无变化，跳过提交"
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "chore: 同步 Cargo.lock 自版本"
            git push origin HEAD:main
          fi

  # 全自动：release-please 创建了 Release PR 时，用 PAT 自动合并，并触发后续构建
  # 关键：用 RELEASE_PLEASE_TOKEN 合并（而非 GITHUB_TOKEN），否则合并不会触发 build workflow。
  # 注意：不要用 release_created == 'false' 做 job 级 if（创建 PR 时该输出为空，条件不命中），
  #       改为在步骤内用 gh pr list 检测是否存在待合并的 Release PR。
  auto-merge:
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - name: 查找并自动合并 release-please 的 Release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          PRS=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,headRefName --jq '.[] | select(.headRefName == "release-please--branches--main") | .number' 2>/dev/null)
          if [ -z "$PRS" ]; then
            echo "没有待合并的 Release PR，跳过"; exit 0
          fi
          for N in $PRS; do
            echo "自动合并 Release PR #$N ..."
            # --admin 用 PAT 强合（main 无分支保护时也能直接合），squash 保持历史干净
            gh pr merge "$N" --repo "$GITHUB_REPOSITORY" --squash --admin || echo "::warning::PR #$N 自动合并失败"
          done