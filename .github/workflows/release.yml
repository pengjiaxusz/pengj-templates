name: release-please
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # 自动版本号 + 生成 release PR / 合并后打 tag 建 release
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}
    steps:
      - id: release
        # 使用 googleapis 官方 action（不再弃用）。token 优先用 PAT，缺省回落 GITHUB_TOKEN。
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  # Tauri GUI + CLI 全平台矩阵构建：Windows/Linux/macOS × x64/arm64
  # 产物命名统一带「系统-架构」，Release 页一眼可辨；便携版含 GUI + CLI。
  build-gui:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            runner: windows-latest
            os: windows
            arch: x86_64
            rust_target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - id: windows-arm64
            runner: windows-11-arm
            os: windows
            arch: arm64
            rust_target: aarch64-pc-windows-msvc
            bundles: msi,nsis
          - id: linux-x64
            runner: ubuntu-latest
            os: linux
            arch: x86_64
            rust_target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - id: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
          - id: macos-arm64
            runner: macos-latest
            os: macos
            arch: arm64
            rust_target: aarch64-apple-darwin
            bundles: dmg
          - id: macos-x64
            # Apple Silicon runner 上交叉编译 x86_64（Tauri 原生支持 --target）
            runner: macos-latest
            os: macos
            arch: x86_64
            rust_target: x86_64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.runner }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUST_TARGET: ${{ matrix.rust_target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: 添加 Rust 目标
        run: rustup target add ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
      # ===== 系统依赖 =====
      - name: 安装 Tauri Linux 依赖
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      # ===== 前端依赖 =====
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # pnpm 11 需 Node >= 22.13
          node-version: 24
          cache: pnpm
      - name: 安装前端依赖
        run: pnpm install
      # Windows 的 MSI/NSIS 只接受 x.y.z 纯数字版本号，
      # 若 tag 是 pre-release（如 0.6.0-beta.1），剥离后缀避免打包报错；不影响产物文件名/release 名。
      - name: Windows 剥离版本号 pre-release 后缀
        if: matrix.os == 'windows'
        run: |
          node -e "
            const fs=require('fs');
            const p='crates/app/src-tauri/tauri.conf.json';
            const c=JSON.parse(fs.readFileSync(p,'utf8'));
            c.version=c.version.replace(/-[^.]+(?:\.[0-9]+)?$/,'');
            fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');
            console.log('Windows 打包版本号:', c.version);
          "
      - name: 构建 Tauri GUI
        run: pnpm --dir crates/app tauri build --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundles }}
      # ===== 构建 CLI（供便携版）=====
      - name: 构建 CLI
        run: cargo build --release -p pengj-cli --target ${{ matrix.rust_target }}
      # ===== 重命名所有产物为「系统-架构」显式命名 =====
      - name: 重命名 GUI / CLI 产物
        shell: bash
        run: |
          set -e
          VER=$(echo "${{ needs.release-please.outputs.tag_name }}" | sed 's/^v//')
          R="$GITHUB_WORKSPACE/target/${{ matrix.rust_target }}/release"
          B="$R/bundle"
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "REL_DIR=$R" >> "$GITHUB_ENV"
          # 可执行文件扩展名（Windows 带 .exe）
          EXT=""
          if [ "${{ matrix.os }}" = "windows" ]; then EXT=".exe"; fi
          # CLI 统一命名 pengj-templates-cli
          mv -f "$R/pengj${EXT}" "$R/pengj-templates-cli${EXT}"
          # 安装包重命名（原始名形如 pengj-templates_0.x.x_x64-setup.exe）
          case "${{ matrix.os }}" in
            windows)
              find "$B/msi"    -name '*.msi'   -exec bash -c '
                for f; do mv -f "$f" "'"$GITHUB_WORKSPACE"'/pengj-templates_'"$VER"'_windows-${{ matrix.arch }}.msi"; done
              ' _ {} +
              find "$B/nsis"   -name '*-setup.exe' -exec bash -c '
                for f; do mv -f "$f" "'"$GITHUB_WORKSPACE"'/pengj-templates_'"$VER"'_windows-${{ matrix.arch }}-setup.exe"; done
              ' _ {} +
              ;;
            linux)
              find "$B/deb"    -name '*.deb' -exec bash -c '
                for f; do mv -f "$f" "'"$GITHUB_WORKSPACE"'/pengj-templates_'"$VER"'_linux-${{ matrix.arch }}.deb"; done
              ' _ {} +
              find "$B/appimage" -name '*.AppImage' -exec bash -c '
                for f; do mv -f "$f" "'"$GITHUB_WORKSPACE"'/pengj-templates_'"$VER"'_linux-${{ matrix.arch }}.AppImage"; done
              ' _ {} +
              ;;
            macos)
              find "$B/dmg"    -name '*.dmg' -exec bash -c '
                for f; do mv -f "$f" "'"$GITHUB_WORKSPACE"'/pengj-templates_'"$VER"'_macos-${{ matrix.arch }}.dmg"; done
              ' _ {} +
              ;;
          esac
      # ===== 便携版 zip（GUI + CLI）=====
      # Windows 用 PowerShell；Linux/macOS 用 bash zip
      - name: 打包便携版（Windows）
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $VER = "$env:VER".Trim()
          # bash 与 pwsh 的 GITHUB_WORKSPACE 路径风格不同，必须用 WS 自行拼接
          $R = "$env:GITHUB_WORKSPACE\target\${{ matrix.rust_target }}\release"
          $PKG = "pengj-templates_${VER}_${{ matrix.os }}-${{ matrix.arch }}_portable.zip"
          Compress-Archive -Path "$R\pengj-templates.exe","$R\pengj-templates-cli.exe" -DestinationPath "$env:GITHUB_WORKSPACE\$PKG" -Force
          "PKG=$PKG" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: 打包便携版（Unix）
        if: matrix.os != 'windows'
        shell: bash
        run: |
          set -e
          R="$REL_DIR"
          PKG="pengj-templates_${VER}_${{ matrix.os }}-${{ matrix.arch }}_portable.zip"
          echo "PKG=$PKG" >> "$GITHUB_ENV"
          case "${{ matrix.os }}" in
            linux)
              (cd "$R" && zip -q "$GITHUB_WORKSPACE/$PKG" pengj-templates pengj-templates-cli)
              ;;
            macos)
              APP=$(find "$R/bundle" -type d -name '*.app' 2>/dev/null | head -n1)
              if [ -n "$APP" ]; then
                # 以 .app 名打包到 zip
                APPNAME=$(basename "$APP")
                (cd "$(dirname "$APP")" && zip -q -r "$GITHUB_WORKSPACE/$PKG" "$APPNAME"; cd "$R" && zip -q "$GITHUB_WORKSPACE/$PKG" pengj-templates-cli)
              else
                echo "::warning::未找到 macOS .app，便携包仅含 CLI"
                (cd "$R" && zip "$GITHUB_WORKSPACE/$PKG" pengj-templates-cli)
              fi
              ;;
          esac
      # ===== 上传安装包 + 便携版到 Release =====
      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pengj-templates_${{ env.VER }}_${{ matrix.os }}-${{ matrix.arch }}*
          tag_name: ${{ needs.release-please.outputs.tag_name }}

  # Release 合并后，把工作区新版本号自动写回 Cargo.lock 并提交
  # （release-please 只会 bump Cargo.toml / package.json，Cargo.lock 需要 cargo 同步）
  sync-lockfile:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: 生成工作区 resolve 并同步自版本号到 Cargo.lock
        run: |
          cargo update --workspace
          git status --porcelain
      - name: 提交并推送 Cargo.lock 同步
        run: |
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock 无变化，跳过提交"
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "chore: 同步 Cargo.lock 自版本"
            git push origin HEAD:main
          fi

  # 全自动：release-please 创建了 Release PR 时，用 PAT 自动合并，并触发后续构建
  # 关键：用 RELEASE_PLEASE_TOKEN 合并（而非 GITHUB_TOKEN），否则合并不会触发 build workflow。
  # 注意：不要用 release_created == 'false' 做 job 级 if（创建 PR 时该输出为空，条件不命中），
  #       改为在步骤内用 gh pr list 检测是否存在待合并的 Release PR。
  auto-merge:
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: 查找并自动合并 release-please 的 Release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          PRS=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,headRefName --jq '.[] | select(.headRefName == "release-please--branches--main") | .number' 2>/dev/null)
          if [ -z "$PRS" ]; then
            echo "没有待合并的 Release PR，跳过"; exit 0
          fi
          for N in $PRS; do
            echo "自动合并 Release PR #$N ..."
            # --admin 用 PAT 强合（main 无分支保护时也能直接合），squash 保持历史干净
            gh pr merge "$N" --repo "$GITHUB_REPOSITORY" --squash --admin || echo "::warning::PR #$N 自动合并失败"
          done