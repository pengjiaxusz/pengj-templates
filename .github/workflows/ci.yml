name: ci

on:
  push:
    branches: [main]
    # 纯文档 / 非构建相关改动直接跳过整个 CI（README、docs、.agents 技能文档等）。
    # 注意：templates/** 是编译期嵌入二进制的，不在此列表，改了必然触发。
    paths-ignore: &docs_only
      - '*.md'
      - 'docs/**'
      - '.agents/**'
  pull_request:
    paths-ignore: *docs_only

permissions:
  contents: read

# 同一分支/PR 连续推送时，自动取消上一次还没跑完的 CI，避免浪费额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 先判定本次提交改了什么，只跑对应模块的检查：
  #   rust → 引擎/CLI/模板/构建配置
  # 两者都没改（例如只动了 release-please 配置）→ 本 job 直接通过，下面两个 job 跳过。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'crates/core/**'
              - 'crates/cli/**'
              - 'crates/mcp/**'
              - 'templates/**'
              - 'crates/gate/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/*.yml'

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # 仓库根的 .cargo/config.toml 把 linux-gnu 目标的链接器写死为 lld，
      # 而 GitHub 的 ubuntu runner 镜像不带 lld，缺了会直接报
      # `linker 'lld' not found`（连 build script 都编不过）。
      - name: 安装 lld（Linux 链接器）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y lld
      # Rust 编译缓存（含失败缓存，修复 commit 也能吃到）
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: 格式检查
        run: cargo fmt --check
      - name: Clippy（warnings 视为错误）
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 构建
        run: cargo build --workspace
      # 提交门禁（crates/gate）已是 workspace member，随 --workspace 一起测。
      # 它的语料来自真实 commitlint 的裁决，测试保证门禁不会比它替换掉的工具更松。
      - name: 测试
        run: cargo test --workspace --no-fail-fast
