[package]
name = "gate"
version = "0.1.0"
edition = "2021"
publish = false
description = "Commit gate: git hooks, code-language guard and conventional commits without a node toolchain"

# Standalone package on purpose. A generated project's root Cargo.toml belongs
# to the project (it is in `update_ignore`), so the template is not allowed to
# append a workspace member entry there. Declaring an empty workspace keeps the
# package buildable in both single-crate and workspace layouts.
[workspace]

[lib]
name = "gate"
path = "src/lib.rs"

[[bin]]
name = "gate"
path = "src/main.rs"
