[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/mcp", "crates/gate"]

[workspace.package]
version = "0.65.0"
edition = "2021"
license = "MIT"
authors = ["pengj"]

[workspace.dependencies]
minijinja = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
sha2 = "0.11"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
similar = "2"
