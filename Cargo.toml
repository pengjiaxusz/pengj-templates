[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/app/src-tauri"]

[workspace.package]
version = "0.21.4-beta.1"
edition = "2021"
license = "MIT"
authors = ["pengj"]

[workspace.dependencies]
minijinja = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
sha2 = "0.11"
include_dir = "0.7"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
